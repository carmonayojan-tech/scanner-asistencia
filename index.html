<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR – Asistencia</title>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwiN2CZRHF77v6exCmn-oyUDaHknzuazsPCO5AD48I5rE4JfogaElEV_HRzHIWO8z84aA/exec';
  </script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,.28);
      padding: 22px 18px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo { font-size: 32px; margin-bottom: 4px; }
    h1 { font-size: 20px; color: #0f172a; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 14px; line-height: 1.5; }

    .estado-wrap { display: flex; gap: 8px; margin-bottom: 10px; }
    .estado-btn {
      flex: 1; padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: .18s;
      color: #334155;
    }
    .estado-btn.active { border-color: #2196F3; background: #2196F3; color: #fff; }

    .camara-wrap {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    .btn-camara {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
      transition: .18s;
    }
    .btn-camara:hover { background: #e2e8f0; }
    .btn-camara:active { transform: scale(.96); }
    .btn-camara svg { width: 18px; height: 18px; }
    .btn-camara.cargando { opacity: .5; pointer-events: none; }

    #qr-reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #000;
      min-height: 240px;
      position: relative;
    }
    #qr-reader__dashboard,
    #qr-reader__header_message,
    #qr-reader__status_span { display: none !important; }
    #qr-reader video { border-radius: 12px; width: 100% !important; }

    #marco-guia {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 190px; height: 190px;
      border: 3px solid #22c55e;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.38);
      pointer-events: none;
      z-index: 10;
    }
    #resultado {
      display: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px; font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
    }
    .ok   { background: #dcfce7; color: #166534; border: 1.5px solid #86efac; }
    .warn { background: #fef3c7; color: #92400e; border: 1.5px solid #fcd34d; }
    .err  { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .btn-cerrar {
      width: 100%; padding: 13px;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; color: #fff;
      background: #ef4444; transition: .18s;
    }
    .btn-cerrar:hover { background: #dc2626; }

    #loading {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      padding: 32px 0; color: #64748b; font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #e2e8f0;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flash { 0%{opacity:1} 50%{opacity:.2} 100%{opacity:1} }
    .detectado { animation: flash .25s ease; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">📷</div>
  <h1>Escáner QR</h1>
  <p class="sub">Apunta la cámara al código QR del estudiante</p>

  <div class="estado-wrap">
    <button class="estado-btn active" id="btn-ingreso" onclick="setEstado('INGRESO')">INGRESO</button>
    <button class="estado-btn"        id="btn-salida"  onclick="setEstado('SALIDA')">SALIDA</button>
  </div>

  <div class="camara-wrap">
    <button class="btn-camara" id="btn-cambiar-camara" onclick="cambiarCamara()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span id="txt-camara">Cámara delantera</span>
    </button>
  </div>

  <div id="qr-reader" style="position:relative">
    <div id="loading">
      <div class="spinner"></div>
      <span>Iniciando cámara...</span>
    </div>
    <div id="marco-guia"></div>
  </div>

  <div id="resultado"></div>
  <button class="btn-cerrar" onclick="cerrar()">Cerrar escáner</button>
</div>

<script>
  if (!APP_URL || APP_URL === 'TU_URL_AQUI' || APP_URL.includes('TU_URL')) {
    window.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loading').innerHTML =
        '<p style="color:#b91c1c;font-size:13px;padding:16px;line-height:1.8;text-align:left">' +
        '⚠️ <strong>URL no configurada</strong><br><br>' +
        'Reemplaza <strong>TU_URL_AQUI</strong> con la URL de tu Web App.</p>';
    });
  }

  let estadoActual = 'INGRESO';
  let procesando   = false;
  let scanner      = null;

  // Lista de cámaras disponibles y índice actual
  let listaCamaras  = [];
  let indiceCamara  = 0; // 0 = trasera, 1 = delantera (si existe)

  function setEstado(e) {
    estadoActual = e;
    document.getElementById('btn-ingreso').classList.toggle('active', e === 'INGRESO');
    document.getElementById('btn-salida').classList.toggle('active',  e === 'SALIDA');
  }

  function mostrar(msg, tipo, autoOcultar) {
    const r = document.getElementById('resultado');
    r.textContent   = msg;
    r.className     = tipo;
    r.style.display = 'block';
    if (autoOcultar) setTimeout(() => { r.style.display = 'none'; procesando = false; }, autoOcultar);
  }

  function registrar(id) {
    if (procesando) return;
    procesando = true;
    const reader = document.getElementById('qr-reader');
    reader.classList.add('detectado');
    setTimeout(() => reader.classList.remove('detectado'), 250);
    mostrar('⏳ Leyendo: ' + id, 'warn', 0);

    const cbName = 'cb_' + Date.now();
    const tag    = document.createElement('script');
    let   timer;

    window[cbName] = function(data) {
      clearTimeout(timer);
      tag.remove();
      delete window[cbName];
      if (data.exito) {
        mostrar('✅ ' + data.estado + ': ' + data.nombre + '\n🕐 ' + data.hora, 'ok', 4000);
      } else {
        mostrar('⚠️ ' + data.mensaje, 'warn', 4000);
      }
    };

    timer = setTimeout(function() {
      tag.remove();
      delete window[cbName];
      mostrar('❌ Sin respuesta del servidor.\n\nVerifica:\n• La URL del Web App es correcta\n• La app está publicada ("Cualquier persona")', 'err', 6000);
    }, 12000);

    tag.src = APP_URL
      + '?page=registrar_jsonp'
      + '&callback=' + cbName
      + '&id='       + encodeURIComponent(id)
      + '&estado='   + encodeURIComponent(estadoActual);
    document.head.appendChild(tag);
  }

  function getCfg() {
    const dim = Math.round(Math.min(window.innerWidth - 80, 380) * 0.58);
    return { fps: 15, qrbox: { width: dim, height: dim }, aspectRatio: 1.0, disableFlip: false };
  }

  const onDecode = (decoded) => registrar(decoded.trim());
  const onError  = () => {};

  function actualizarBoton() {
    const btn = document.getElementById('btn-cambiar-camara');
    const txt = document.getElementById('txt-camara');
    btn.classList.remove('cargando');

    if (listaCamaras.length <= 1) {
      // Solo hay una cámara — ocultar botón
      btn.style.display = 'none';
      return;
    }

    // Mostrar hacia dónde va a cambiar (la opuesta)
    const siguienteIdx = (indiceCamara + 1) % listaCamaras.length;
    const siguiente    = listaCamaras[siguienteIdx];
    const esDelantera  = siguiente.label.toLowerCase().includes('front')
                      || siguiente.label.toLowerCase().includes('delantera')
                      || siguiente.label.toLowerCase().includes('facing front')
                      || siguienteIdx > 0;
    txt.textContent = esDelantera ? 'Cámara delantera' : 'Cámara trasera';
  }

  function mostrarErrorCamara(err) {
    document.getElementById('loading').innerHTML =
      '<p style="color:#b91c1c;font-size:13px;padding:16px;line-height:1.8;text-align:left">' +
      '❌ <strong>Sin acceso a la cámara</strong><br><br>' +
      '1. Haz clic en el ícono 🔒 junto a la URL<br>' +
      '2. Cambia "Cámara" → <strong>Permitir</strong><br>' +
      '3. Recarga la página (F5)<br><br>' +
      '<small style="color:#94a3b8">' + (err || '') + '</small></p>';
  }

  function arrancarConId(camaraId) {
    return new Promise((resolve, reject) => {
      scanner = new Html5Qrcode('qr-reader');
      scanner.start(camaraId, getCfg(), onDecode, onError)
        .then(resolve)
        .catch(reject);
    });
  }

  function iniciarScanner() {
    // Obtener lista real de cámaras del dispositivo
    Html5Qrcode.getCameras()
      .then(function(camaras) {
        if (!camaras || camaras.length === 0) {
          mostrarErrorCamara('No se encontraron cámaras en este dispositivo.');
          return;
        }

        listaCamaras = camaras;

        // Buscar cámara trasera (back/environment) como índice 0
        // En Android suele ser la primera; buscamos por label para estar seguros
        const idxTrasera = camaras.findIndex(c =>
          c.label.toLowerCase().includes('back')
          || c.label.toLowerCase().includes('trasera')
          || c.label.toLowerCase().includes('rear')
          || c.label.toLowerCase().includes('environment')
        );

        // Si encontramos trasera, ponerla primero en la lista
        if (idxTrasera > 0) {
          const trasera = camaras.splice(idxTrasera, 1)[0];
          listaCamaras.unshift(trasera);
        }

        indiceCamara = 0;
        arrancarConId(listaCamaras[0].id)
          .then(function() {
            document.getElementById('loading').style.display    = 'none';
            document.getElementById('marco-guia').style.display = 'block';
            actualizarBoton();
          })
          .catch(mostrarErrorCamara);
      })
      .catch(function(err) {
        // Fallback: intentar con facingMode si getCameras falla
        scanner = new Html5Qrcode('qr-reader');
        scanner.start({ facingMode: 'environment' }, getCfg(), onDecode, onError)
          .then(function() {
            listaCamaras = [{ id: 'environment', label: 'Cámara trasera' },
                            { id: 'user',        label: 'Cámara delantera' }];
            indiceCamara = 0;
            document.getElementById('loading').style.display    = 'none';
            document.getElementById('marco-guia').style.display = 'block';
            actualizarBoton();
          })
          .catch(mostrarErrorCamara);
      });
  }

  function cambiarCamara() {
    if (!scanner || listaCamaras.length <= 1) return;

    const btn = document.getElementById('btn-cambiar-camara');
    const txt = document.getElementById('txt-camara');
    btn.classList.add('cargando');
    txt.textContent = 'Cambiando...';

    const siguienteIdx = (indiceCamara + 1) % listaCamaras.length;
    const siguienteCam = listaCamaras[siguienteIdx];

    scanner.stop()
      .then(function() {
        document.getElementById('loading').style.display    = 'flex';
        document.getElementById('marco-guia').style.display = 'none';

        // Usar ID real de cámara o facingMode como fallback
        const camaraId = siguienteCam.id === 'user' || siguienteCam.id === 'environment'
          ? { facingMode: siguienteCam.id }
          : siguienteCam.id;

        scanner = new Html5Qrcode('qr-reader');
        return scanner.start(camaraId, getCfg(), onDecode, onError);
      })
      .then(function() {
        indiceCamara = siguienteIdx;
        document.getElementById('loading').style.display    = 'none';
        document.getElementById('marco-guia').style.display = 'block';
        actualizarBoton();
      })
      .catch(function() {
        // Si falla, volver a la cámara anterior
        const camAnterior = listaCamaras[indiceCamara];
        const camaraId = camAnterior.id === 'user' || camAnterior.id === 'environment'
          ? { facingMode: camAnterior.id }
          : camAnterior.id;

        scanner = new Html5Qrcode('qr-reader');
        scanner.start(camaraId, getCfg(), onDecode, onError)
          .then(function() {
            document.getElementById('loading').style.display    = 'none';
            document.getElementById('marco-guia').style.display = 'block';
            actualizarBoton();
          })
          .catch(mostrarErrorCamara);
        mostrar('⚠️ No se pudo cambiar de cámara', 'warn', 3000);
      });
  }

  function cerrar() {
    if (scanner) {
      scanner.stop().catch(() => {}).finally(() => window.close());
    } else {
      window.close();
    }
  }

  window.addEventListener('load', iniciarScanner);
</script>
</body>
</html>
