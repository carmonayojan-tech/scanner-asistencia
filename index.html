<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR – Asistencia</title>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycby-Or9laZWEPMimVZCSycilF8rpfuLXB_K9bFiOJ627c0o52kUKe-_PIKrcHyVP-rQpwg/exec';
  </script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0,0,0,.28);
      padding: 22px 18px; width: 100%; max-width: 420px; text-align: center;
    }
    .logo { font-size: 32px; margin-bottom: 4px; }
    h1 { font-size: 20px; color: #0f172a; margin-bottom: 4px; }
    .sub { font-size: 12px; color: #64748b; margin-bottom: 14px; line-height: 1.5; }

    .estado-wrap { display: flex; gap: 8px; margin-bottom: 10px; }
    .estado-btn {
      flex: 1; padding: 10px; border: 2px solid #e2e8f0;
      border-radius: 10px; background: #f8fafc;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: .18s; color: #334155;
    }
    .estado-btn.active { border-color: #2196F3; background: #2196F3; color: #fff; }

    /* Botón cámara — oculto por defecto */
    .camara-wrap { display: flex; justify-content: flex-end; margin-bottom: 10px; min-height: 36px; }
    #btn-cambiar-camara {
      display: none;
      align-items: center; gap: 6px; padding: 7px 14px;
      border: 2px solid #e2e8f0; border-radius: 10px; background: #f8fafc;
      font-size: 13px; font-weight: 600; cursor: pointer; color: #334155;
      transition: .18s; user-select: none;
    }
    #btn-cambiar-camara:hover  { background: #e2e8f0; }
    #btn-cambiar-camara:active { transform: scale(.96); }
    #btn-cambiar-camara svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Visor QR */
    #visor-wrap {
      width: 100%; border-radius: 12px; overflow: hidden;
      margin-bottom: 12px; background: #000; min-height: 260px;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    #qr-reader { width: 100%; }
    #qr-reader__dashboard, #qr-reader__header_message,
    #qr-reader__status_span { display: none !important; }
    #qr-reader video { width: 100% !important; display: block; }

    #marco-guia {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 190px; height: 190px;
      border: 3px solid #22c55e; border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.38);
      pointer-events: none; z-index: 10;
      display: none;
    }
    #overlay-msg {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: #94a3b8; font-size: 14px;
      background: #000; border-radius: 12px; z-index: 5;
    }
    .spinner {
      width: 36px; height: 36px; border: 4px solid #334155;
      border-top-color: #2196F3; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes flash { 0%{opacity:1} 50%{opacity:.2} 100%{opacity:1} }
    .flash-anim { animation: flash .25s ease; }

    #resultado {
      display: none; border-radius: 10px; padding: 12px 14px;
      font-size: 14px; font-weight: 600; margin-bottom: 12px;
      line-height: 1.6; white-space: pre-wrap; text-align: left;
    }
    .ok   { background: #dcfce7; color: #166534; border: 1.5px solid #86efac; }
    .warn { background: #fef3c7; color: #92400e; border: 1.5px solid #fcd34d; }
    .err  { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .btn-cerrar {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer; color: #fff;
      background: #ef4444; transition: .18s;
    }
    .btn-cerrar:hover { background: #dc2626; }

    #badge-cola { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #btn-sync {
      flex-shrink: 0; border: 1.5px solid #f59e0b; background: #fff;
      color: #92400e; font-size: 11px; font-weight: 700;
      border-radius: 8px; padding: 4px 8px; cursor: pointer;
    }
    #btn-sync:active { transform: scale(.95); }
    #btn-sync:disabled { opacity: .5; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">📷</div>
  <h1>Escáner QR</h1>
  <p class="sub">Apunta la cámara al código QR del estudiante</p>

  <div class="estado-wrap">
    <button class="estado-btn active" id="btn-ingreso" onclick="setEstado('INGRESO')">INGRESO</button>
    <button class="estado-btn"        id="btn-salida"  onclick="setEstado('SALIDA')">SALIDA</button>
  </div>

  <div class="camara-wrap">
    <button id="btn-cambiar-camara" onclick="cambiarCamara()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span id="txt-camara">Cámara delantera</span>
    </button>
  </div>

  <div id="visor-wrap">
    <div id="qr-reader"></div>
    <div id="marco-guia"></div>
    <div id="overlay-msg">
      <div class="spinner"></div>
      <span id="overlay-txt">Iniciando cámara...</span>
    </div>
  </div>

  <div id="resultado"></div>
  <button class="btn-cerrar" onclick="cerrar()">Cerrar escáner</button>
</div>

<script>
  /* ══════════════════════════════════════════
     ESTADO GLOBAL
  ══════════════════════════════════════════ */
  let estadoActual  = 'INGRESO';
  let procesando    = false;
  let scanner       = null;
  let cambiando     = false;
  let idTrasera     = null;   // ID real de cámara trasera
  let idDelantera   = null;   // ID real de cámara delantera
  let usandoTrasera = true;

  const esMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  /* ══════════════════════════════════════════
     UI HELPERS
  ══════════════════════════════════════════ */
  function setEstado(e) {
    estadoActual = e;
    document.getElementById('btn-ingreso').classList.toggle('active', e === 'INGRESO');
    document.getElementById('btn-salida').classList.toggle('active',  e === 'SALIDA');
  }

  function mostrarOverlay(texto) {
    const o = document.getElementById('overlay-msg');
    document.getElementById('overlay-txt').textContent = texto;
    o.style.display = 'flex';
    document.getElementById('marco-guia').style.display = 'none';
  }

  function ocultarOverlay() {
    document.getElementById('overlay-msg').style.display = 'none';
    document.getElementById('marco-guia').style.display  = 'block';
  }

  function mostrarError(msg) {
    document.getElementById('overlay-msg').innerHTML =
      '<p style="color:#fca5a5;font-size:13px;padding:16px;line-height:1.8;text-align:left">' +
      '❌ <strong>Sin acceso a la cámara</strong><br><br>' +
      '1. Toca el ícono 🔒 junto a la URL<br>' +
      '2. Cambia "Cámara" → <strong>Permitir</strong><br>' +
      '3. Recarga la página<br><br>' +
      '<small style="opacity:.7">' + (msg || '') + '</small></p>';
    document.getElementById('overlay-msg').style.display = 'flex';
  }

  function mostrar(msg, tipo, ms) {
    const r = document.getElementById('resultado');
    r.textContent = msg; r.className = tipo; r.style.display = 'block';
    if (ms) setTimeout(() => { r.style.display = 'none'; procesando = false; }, ms);
  }

  function actualizarBoton() {
    document.getElementById('txt-camara').textContent =
      usandoTrasera ? 'Cámara delantera' : 'Cámara trasera';
    document.getElementById('btn-cambiar-camara').style.opacity  = '1';
    document.getElementById('btn-cambiar-camara').style.pointerEvents = 'auto';
  }

  function bloquearBoton(txt) {
    document.getElementById('txt-camara').textContent = txt || 'Cambiando...';
    document.getElementById('btn-cambiar-camara').style.opacity  = '0.4';
    document.getElementById('btn-cambiar-camara').style.pointerEvents = 'none';
  }

  /* ══════════════════════════════════════════
     REGISTRO JSONP — con reintentos y cola offline
  ══════════════════════════════════════════ */
  const INTENTOS_MAX = 3;
  const TIMEOUTS_MS  = [5000, 6000, 7000]; // timeout de cada intento (crece un poco)
  const COLA_KEY     = 'colaAsistenciaPendiente';

  // Envía UNA solicitud JSONP y devuelve una Promise.
  // Se rechaza si no responde a tiempo o si el <script> falla al cargar
  // (por ejemplo, sin conexión a internet).
  function enviarJsonp(id, estado, timeoutMs) {
    return new Promise(function(resolve, reject) {
      const cbName = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const tag = document.createElement('script');
      let timer;

      function limpiar() {
        clearTimeout(timer);
        delete window[cbName];
        tag.remove();
      }

      window[cbName] = function(data) { limpiar(); resolve(data); };
      tag.onerror    = function()     { limpiar(); reject(new Error('network')); };
      timer = setTimeout(function() { limpiar(); reject(new Error('timeout')); }, timeoutMs);

      tag.src = APP_URL + '?page=registrar_jsonp&callback=' + cbName
        + '&id=' + encodeURIComponent(id) + '&estado=' + encodeURIComponent(estado);
      document.head.appendChild(tag);
    });
  }

  function registrar(id) {
    if (procesando) return;
    procesando = true;
    document.getElementById('visor-wrap').classList.add('flash-anim');
    setTimeout(() => document.getElementById('visor-wrap').classList.remove('flash-anim'), 250);
    intentarRegistro(id, estadoActual, 1);
  }

  function intentarRegistro(id, estado, intento) {
    mostrar('⏳ Leyendo: ' + id + (intento > 1 ? ' (reintento ' + intento + '/' + INTENTOS_MAX + ')' : ''), 'warn', 0);

    enviarJsonp(id, estado, TIMEOUTS_MS[intento - 1] || 7000)
      .then(function(data) {
        if (data.exito) {
          mostrar('✅ ' + data.estado + ': ' + data.nombre + '\n🕐 ' + data.hora, 'ok', 4000);
        } else {
          // El servidor SÍ respondió, solo que el registro no fue válido
          // (ej. alumno no encontrado, doble registro). No es un problema
          // de red, así que no tiene sentido reintentar.
          mostrar('⚠️ ' + data.mensaje, 'warn', 4000);
        }
      })
      .catch(function() {
        if (intento < INTENTOS_MAX) {
          setTimeout(function() { intentarRegistro(id, estado, intento + 1); }, 800);
        } else {
          // Se agotaron los reintentos: no perdemos el escaneo del alumno,
          // se guarda en el dispositivo y se reenvía solo cuando vuelva la señal.
          encolarPendiente(id, estado);
          mostrar('📥 Sin señal por ahora.\nGuardado, se enviará automáticamente al volver internet.', 'warn', 5000);
        }
      });
  }

  /* ── Cola offline: guarda en el dispositivo lo que no se pudo enviar ── */
  function leerCola() {
    try { return JSON.parse(localStorage.getItem(COLA_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function guardarCola(cola) {
    try { localStorage.setItem(COLA_KEY, JSON.stringify(cola)); } catch (e) {}
  }
  function encolarPendiente(id, estado) {
    const cola = leerCola();
    cola.push({ id: id, estado: estado, ts: Date.now() });
    guardarCola(cola);
    actualizarBadgeCola();
  }
  function actualizarBadgeCola() {
    const cola = leerCola();
    let badge = document.getElementById('badge-cola');
    if (!badge) {
      badge = document.createElement('div');
      badge.id = 'badge-cola';
      badge.style.cssText = 'font-size:11px;font-weight:600;color:#92400e;background:#fef3c7;'
        + 'border:1.5px solid #fcd34d;border-radius:8px;padding:6px 10px;margin-bottom:10px;display:none;';
      badge.innerHTML = '<span id="txt-cola"></span><button id="btn-sync" type="button">🔄 Sincronizar ahora</button>';
      document.querySelector('.card').insertBefore(badge, document.getElementById('resultado'));
      document.getElementById('btn-sync').addEventListener('click', function() {
        sincronizarManual();
      });
    }
    const txt = document.getElementById('txt-cola');
    if (cola.length > 0) {
      txt.textContent = '📶 ' + cola.length + ' pendiente(s)'
        + (ultimoErrorCola ? ' — ' + ultimoErrorCola : '');
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  let colaEnProceso = false;
  let ultimoErrorCola = '';

  function sincronizarManual() {
    const btn = document.getElementById('btn-sync');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Enviando...'; }
    colaEnProceso = false; // por si quedó trabada, forzamos un intento nuevo ya
    procesarCola(function() {
      if (btn) { btn.disabled = false; btn.textContent = '🔄 Sincronizar ahora'; }
    });
  }

  function procesarCola(onDone) {
    if (colaEnProceso) { if (onDone) onDone(); return; }
    const cola = leerCola();
    if (cola.length === 0) { if (onDone) onDone(); return; }
    colaEnProceso = true;
    const item = cola[0];

    enviarJsonp(item.id, item.estado, 6000)
      .then(function() {
        const restante = leerCola();
        restante.shift(); // quitar el que ya se envió
        guardarCola(restante);
        ultimoErrorCola = '';
        colaEnProceso = false;
        actualizarBadgeCola();
        if (restante.length > 0) procesarCola(onDone);
        else if (onDone) onDone();
      })
      .catch(function(err) {
        ultimoErrorCola = (err && err.message === 'timeout') ? 'sin respuesta' : 'sin conexión';
        colaEnProceso = false;
        actualizarBadgeCola();
        if (onDone) onDone();
      });
  }

  // Reintenta la cola pendiente cada 15s...
  setInterval(function() { procesarCola(); }, 15000);
  // ...apenas el navegador detecte que volvió la conexión...
  window.addEventListener('online', function() { procesarCola(); });
  // ...y apenas la pestaña vuelva a estar activa (clave: si la tablet se
  // apagó la pantalla o el navegador quedó en segundo plano, los timers
  // se congelan y esto es lo único que dispara el reintento al reactivarse).
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) procesarCola();
  });
  window.addEventListener('load', function() { actualizarBadgeCola(); procesarCola(); });

  /* ══════════════════════════════════════════
     CONFIGURACIÓN ESCÁNER
  ══════════════════════════════════════════ */
  function getCfg() {
    const dim = Math.round(Math.min(window.innerWidth - 80, 380) * 0.58);
  return { fps: 25, qrbox: { width: 140, height: 140 }, aspectRatio: 1.0, disableFlip: true };
  }

  /* ══════════════════════════════════════════
     ARRANCAR ESCÁNER CON ID O FACINGMODE
  ══════════════════════════════════════════ */
  function arrancar(camaraId) {
    // Destruir instancia previa si existe
    if (scanner) {
      try { scanner.clear(); } catch(e) {}
      scanner = null;
    }
    document.getElementById('qr-reader').innerHTML = '';
    scanner = new Html5Qrcode('qr-reader');
    return scanner.start(camaraId, getCfg(), d => registrar(d.trim()), () => {});
  }

  /* ══════════════════════════════════════════
     INICIO
  ══════════════════════════════════════════ */
  function iniciarScanner() {
    mostrarOverlay('Iniciando cámara...');

    Html5Qrcode.getCameras()
      .then(function(lista) {
        if (!lista || lista.length === 0) {
          iniciarConFacingMode(); return;
        }

        // Clasificar cámaras por label
        lista.forEach(function(cam) {
          const lbl = (cam.label || '').toLowerCase();
          const esTrasera = lbl.includes('back') || lbl.includes('rear')
                         || lbl.includes('trasera') || lbl.includes('0,');
          const esDelantera = lbl.includes('front') || lbl.includes('delantera')
                           || lbl.includes('user')  || lbl.includes('facing front');
          if (esTrasera  && !idTrasera)   idTrasera   = cam.id;
          if (esDelantera && !idDelantera) idDelantera = cam.id;
        });

        // Fallback: si no se clasificaron por label, usar posición
        if (!idTrasera   && lista.length >= 1) idTrasera   = lista[0].id;
        if (!idDelantera && lista.length >= 2) idDelantera = lista[1].id;

        // Mostrar botón solo si hay delantera disponible en móvil
        if (esMobile && idDelantera && idDelantera !== idTrasera) {
          document.getElementById('btn-cambiar-camara').style.display = 'flex';
        }

        // Arrancar con trasera
        usandoTrasera = true;
        arrancar(idTrasera)
          .then(function() { ocultarOverlay(); actualizarBoton(); })
          .catch(function(e) { mostrarError(e); });
      })
      .catch(function() {
        // getCameras no disponible: usar facingMode
        iniciarConFacingMode();
      });
  }

  function iniciarConFacingMode() {
    // Mostrar botón en móvil (asumimos que tienen 2 cámaras)
    if (esMobile) {
      document.getElementById('btn-cambiar-camara').style.display = 'flex';
    }
    usandoTrasera = true;
    arrancar({ facingMode: 'environment' })
      .then(function() { ocultarOverlay(); actualizarBoton(); })
      .catch(function() {
        arrancar({ facingMode: 'user' })
          .then(function() {
            usandoTrasera = false;
            ocultarOverlay(); actualizarBoton();
          })
          .catch(mostrarError);
      });
  }

  /* ══════════════════════════════════════════
     CAMBIAR CÁMARA
  ══════════════════════════════════════════ */
  function cambiarCamara() {
    if (!scanner || cambiando) return;
    cambiando = true;
    bloquearBoton('Cambiando...');
    mostrarOverlay('Cambiando cámara...');

    const nuevaEsTrasera = !usandoTrasera;

    // Determinar ID destino
    let idDestino;
    if (idTrasera && idDelantera) {
      idDestino = nuevaEsTrasera ? idTrasera : idDelantera;
    } else {
      idDestino = { facingMode: nuevaEsTrasera ? 'environment' : 'user' };
    }

    scanner.stop()
      .catch(() => {})
      .finally(function() {
        // Pausa para liberar hardware en Android
        setTimeout(function() {
          arrancar(idDestino)
            .then(function() {
              usandoTrasera = nuevaEsTrasera;
              ocultarOverlay();
              actualizarBoton();
              cambiando = false;
            })
            .catch(function(e) {
              // Volver a la cámara anterior
              const idAnterior = nuevaEsTrasera
                ? (idDelantera || { facingMode: 'user' })
                : (idTrasera   || { facingMode: 'environment' });

              setTimeout(function() {
                arrancar(idAnterior)
                  .then(function() {
                    ocultarOverlay();
                    actualizarBoton();
                    cambiando = false;
                    mostrar('⚠️ Cámara no disponible, volviendo a la anterior', 'warn', 3000);
                  })
                  .catch(function(err) { cambiando = false; mostrarError(err); });
              }, 600);
            });
        }, 800);
      });
  }

  /* ══════════════════════════════════════════
     CERRAR
  ══════════════════════════════════════════ */
  function cerrar() {
    if (scanner) {
      scanner.stop().catch(() => {}).finally(() => window.close());
    } else {
      window.close();
    }
  }

  window.addEventListener('load', iniciarScanner);
</script>
</body>
</html>
